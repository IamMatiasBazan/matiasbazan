  <!-- Lógica de animación interactiva en Scroll (Con Lerp Suave) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const frames = document.querySelectorAll('.person-frame');
      const projectsImg = document.getElementById('projectsImg');
      const bgTextLeft = document.getElementById('bgTextLeft');
      const bgTextRight = document.getElementById('bgTextRight');

      // Pre-cargar imágenes para evitar parpadeos
      const imagesToPreload = [
        'img/matias.png',
        'img/45grados.webp',
        'img/90grados.webp',
        'img/180grados.webp',
        'img/45grados_izquierda.webp'
      ];
      imagesToPreload.forEach(src => {
        const img = new Image();
        img.src = src;
      });

      // Variables para la animación fluida (Lerp)
      let targetScrollPercent = 0;
      let currentScrollPercent = 0;
      const ease = 0.025; // Factor de suavizado (menor = más lento y suave)

      // Escuchar el evento de scroll y guardar la posición objetivo
      function onScroll() {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        targetScrollPercent = maxScroll > 0 ? window.scrollY / maxScroll : 0;
      }

      window.addEventListener('scroll', onScroll);
      onScroll();
      
      // Inicializar el scroll actual para que comience donde está el scrollbar
      currentScrollPercent = targetScrollPercent;

      // Bucle de animación continua
      function animate() {
        // Interpolación lineal suave (lerp)
        currentScrollPercent += (targetScrollPercent - currentScrollPercent) * ease;

        // 1. Determinar qué frame mostrar basado en currentScrollPercent (0 a 360 grados)
        const angle = currentScrollPercent * 360;
        let activeIndex = 0;

        if (angle >= 0 && angle < 22.5) {
          activeIndex = 0; // Frente (0deg)
        } else if (angle >= 22.5 && angle < 112.5) {
          activeIndex = 4; // 45deg izquierda (315deg)
        } else if (angle >= 112.5 && angle < 225) {
          activeIndex = 3; // 180deg espalda
        } else if (angle >= 225 && angle < 292.5) {
          activeIndex = 2; // 90deg derecha
        } else if (angle >= 292.5 && angle < 337.5) {
          activeIndex = 1; // 45deg derecha
        } else {
          activeIndex = 0; // Frente (360deg)
        }

        frames.forEach((frame, idx) => {
          if (idx === activeIndex) {
            frame.classList.add('active');
          } else {
            frame.classList.remove('active');
          }
        });

        // 2. Efecto paralaje y zoom suave para los proyectos flotantes
        const translateY = currentScrollPercent * -60;
        const scale = 1 + currentScrollPercent * 0.03;
        projectsImg.style.transform = `translateY(${translateY}px) scale(${scale})`;

        // 3. Efecto paralaje para el texto de fondo (se separan lateralmente de izquierda a derecha)
        const textTranslateXLeft = currentScrollPercent * -120;
        const textTranslateXRight = currentScrollPercent * 120;
        bgTextLeft.style.transform = `translateX(${textTranslateXLeft}px)`;
        bgTextRight.style.transform = `translateX(${textTranslateXRight}px)`;

        // 4. Lógica de Dock Activo automática
        const dockItems = document.querySelectorAll('.dock-item');
        if (dockItems.length > 0) {
          const activeIndex = Math.min(Math.floor(currentScrollPercent * dockItems.length), dockItems.length - 1);
          dockItems.forEach((d, i) => i === activeIndex ? d.classList.add('active') : d.classList.remove('active'));
        }

        // Ejecutar siguiente frame del bucle
        requestAnimationFrame(animate);
      }

      // Iniciar bucle
      animate();
    });
  </script>

  <script>
    function startBootSequence(e) {
      e.preventDefault();
      const overlay = document.getElementById('bootOverlay');
      const logo = document.getElementById('bootLogo');
      const progressWrap = document.getElementById('bootProgressWrap');
      const progressBar = document.getElementById('bootProgressBar');
      const bootText = document.getElementById('bootText');

      overlay.style.display = 'flex';

      // Fase 1: Fade in logo con efecto glow
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          logo.style.opacity = '1';
          logo.style.transform = 'scale(1)';
        });
      });

      // Fase 2: Mostrar barra de progreso
      setTimeout(() => {
        progressWrap.style.opacity = '1';
        bootText.style.opacity = '1';
      }, 1000);

      // Fase 3: Animación de carga progresiva
      let progress = 0;
      const steps = [
        { target: 18, delay: 1200 },
        { target: 35, delay: 1800 },
        { target: 52, delay: 2400 },
        { target: 68, delay: 3000 },
        { target: 82, delay: 3500 },
        { target: 94, delay: 4000 },
        { target: 100, delay: 4400 },
      ];

      steps.forEach(({ target, delay }) => {
        setTimeout(() => {
          progressBar.style.width = target + '%';
        }, delay);
      });

      // Fase 4: Flash blanco al completar y redirigir
      setTimeout(() => {
        overlay.style.transition = 'background 0.5s ease, opacity 0.5s ease';
        overlay.style.background = '#ffffff';
        overlay.style.opacity = '0.95';
        setTimeout(() => {
          overlay.style.opacity = '0';
          setTimeout(() => {
            window.location.href = 'os/index.html';
          }, 400);
        }, 300);
      }, 4700);
    }
  </script>
